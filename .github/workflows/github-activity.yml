name: Update GitHub activity

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate contribution calendar
        run: node scripts/github-activity.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub contribution calendar"
            git push
          fi
